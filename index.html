const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KDB = 'field-notes-key';
function kdb(mode, fn){ return new Promise((res, rej) => { const r = indexedDB.open(KDB, 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => { const t = r.result.transaction('k', mode); const q = fn(t.objectStore('k')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }; r.onerror = () => rej(r.error); }); }
async function derive(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(D.salt), iterations:D.it, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function open(key){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(D.iv) }, key, b64(D.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async () => {
  try { const k = await kdb('readonly', s => s.get('k')); if (k){ await open(k); return; } } catch(e){ try { await kdb('readwrite', s => s.delete('k')); } catch(_){} }

})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), m = document.getElementById('m');
  btn.disabled = true; btn.textContent = 'Opening'; m.textContent = '';

    const key = await derive(document.getElementById('p').value);
    await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(D.iv) }, key, b64(D.ct));

    await open(key);
  } catch(err){ btn.disabled = false; btn.textContent = 'Open'; m.textContent = 'That passphrase did not work.'; }
});
